name: Channel list
# Every 6 hours: pick up new channels and fixed links from Free-TV and iptv-org, test every stream,
# keep numbers stable, rebuild channels/dist. GitHub's servers are in the US, so a stream that worked
# before and is now refused (403/451) keeps its "ok" status (--keep-ok-on-refusal).
on:
  schedule: [{ cron: "41 */6 * * *" }]   # every 6 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: channels, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python channels/build_channels.py --keep-logos --keep-ok-on-refusal --workers 48
      - run: |
          git config user.name "Tony channel list"
          git config user.email "channels@users.noreply.github.com"
          git add channels/channels.json channels/dist
          git diff --cached --quiet || (git commit -q -m "Daily channel list refresh" && git push -q)
