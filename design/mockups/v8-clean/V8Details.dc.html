<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony v8 — Channel page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#12131A}
.k{position:relative;overflow:hidden;border-radius:22px;background:#1E2130;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.k .a{position:absolute;left:0;top:0;width:100%;height:128%;object-fit:cover;object-position:center top}
.k .f{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 28%,rgba(10,11,16,.7) 55%,rgba(14,15,21,.97) 100%)}
.k .m{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.k .m img{width:26px;height:18px;object-fit:contain}
.k .c{position:absolute;left:22px;right:22px;bottom:18px;display:flex;flex-direction:column;gap:6px}
.k .n{font-size:32px;font-weight:850;letter-spacing:-1px;line-height:1}
.k .s{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:rgba(255,255,255,.8)}
.dot{width:8px;height:8px;border-radius:999px;background:#FF453A;display:inline-block}
.on{transform:scale(1.07);box-shadow:0 24px 50px rgba(0,0,0,.6)}
.rb{width:64px;height:64px;border-radius:999px;border:0;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;padding:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #12131A; font-family: Inter, system-ui, sans-serif; color: #FFFFFF">
  <img src="/_blob/29be0d734aec41b4ec6f202cdc87ec1e" alt="" style="position: absolute; inset: 0; width: 1920px; height: 1300px; object-fit: cover; object-position: center top">
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16,17,24,0.95) 0%, rgba(16,17,24,0.8) 32%, rgba(16,17,24,0.25) 60%, rgba(16,17,24,0) 78%)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 600px; background: linear-gradient(180deg, rgba(18,19,26,0) 0%, rgba(18,19,26,0.88) 45%, #12131A 72%)"></div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 220px; background: linear-gradient(180deg, rgba(10,11,16,0.85) 0%, rgba(10,11,16,0) 100%)"></div>

  <section style="position: absolute; left: 104px; top: 150px; width: 760px; display: flex; flex-direction: column; gap: 20px">
    <h1 style="margin: 0; font-size: 116px; line-height: 0.95; font-weight: 850; letter-spacing: -4px">LBCI</h1>
    <div style="display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.85)">
      <span style="width: 40px; height: 40px; border-radius: 999px; background: #ECECEC; display: inline-flex; align-items: center; justify-content: center"><img src="/_blob/9fa51d92ab5165ea8c2cb6779b22ea27" alt="" style="width: 14px; height: 30px; object-fit: contain"></span>
      <span style="display: inline-flex; align-items: center; gap: 8px"><i class="dot"></i>Live</span><span>·</span><span>Channel 20</span><span>·</span><span>Lebanon</span><span>·</span><span>General</span>
      <span style="padding: 2px 8px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.5); font-size: 15px; font-weight: 700">HD</span>
    </div>
    <p style="margin: 0; font-size: 24px; line-height: 1.45; color: rgba(255,255,255,0.72); max-width: 620px">News, drama and talk shows from Lebanon's longest-running private channel.</p>
    <div style="display: flex; align-items: center; gap: 16px; margin-top: 12px">
      <button style="display: inline-flex; align-items: center; gap: 12px; height: 64px; padding: 0 40px; border-radius: 999px; border: 0; background: #FFFFFF; color: #12131A; font-family: Inter, sans-serif; font-size: 24px; font-weight: 700; transform: scale(1.06); box-shadow: 0 16px 40px rgba(0,0,0,0.5)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="#12131A"></path></svg>Watch
      </button>
      <button style="display: inline-flex; align-items: center; gap: 10px; height: 64px; padding: 0 28px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.18); color: #FFFFFF; font-family: Inter, sans-serif; font-size: 22px; font-weight: 650">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.1 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.6 0 5.7 3.6 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="#FF9F0A"></path></svg>Favourited
      </button>
    </div>
  </section>

  <section style="position: absolute; left: 104px; top: 760px; width: 1816px">
    <h2 style="margin: 0 0 20px; font-size: 28px; font-weight: 700; color: rgba(255,255,255,0.92)">More from Lebanon</h2>
    <div style="display: flex; gap: 30px">
      <sc-for list="{{row}}" as="c" hint-placeholder-count="5">
        <div class="{{c.cls}}" style="{{c.size}}"><img class="a" src="{{c.still}}" alt=""><div class="f"></div><span class="m" style="{{c.mb}}"><img src="{{c.logo}}" alt=""></span><div class="c"><span class="n">{{c.name}}</span><span class="s"><i class="dot"></i>{{c.sub}}</span></div></div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
const B = "/_blob/";
const C = {
  mtv: ["MTV Lebanon", "6fbead2f1c968b4fceaae54671f5c5df", "806897165a56c7330301894add296d43", "#1C2454"],
  jadeed: ["Al Jadeed", "a43cdbe74aac16f075b0680eb579ece7", "f892f50f188401e64a0b50be530bcf7c", "#0B0C10"],
  otv: ["OTV", "bba1af7919c3ee4b4a1d8f14a420659b", "91baad3c2694810afe0f424226023a3b", "#FFFFFF"],
  tl: ["Tele Liban", "3f7dbbdd97969cbcc6e257e38d943f2b", "e02529e80e393ac397a8007c2c1a8bdc", "#EC1C24"],
  may: ["Al Mayadeen", "e10010d3ba813d044f42ed031c14062e", "0480171651be9f1de781b64a25aca521", "#FFFFFF"]
};
function card(k, sub, w, h, on) { const c = C[k]; return { name: c[0], still: B + c[1], logo: B + c[2], mb: "background:" + c[3], sub: sub, cls: on ? "k on" : "k", size: "flex:0 0 " + w + "px;width:" + w + "px;height:" + h + "px" }; }
class Component extends DCLogic {
  renderVals() { return { row: ["mtv", "jadeed", "otv", "tl", "may"].map((k) => card(k, "Live", 420, 236, false)) }; }
}
</script>
</body>
</html>
