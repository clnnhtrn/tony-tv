<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony home, version 3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #5B3A44; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">

<div style="position: absolute; left: 0; right: 0; top: 520px; bottom: 0; background: #3B2530"></div>
<div style="position: absolute; right: 300px; top: 150px; width: 220px; height: 220px; border-radius: 110px; background: #E8A87C"></div>
<span style="position: absolute; right: 120px; top: 440px; font-size: 22px; color: #F3E3E6; font-weight: 500">Live picture of the highlighted channel, muted</span>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 460px; background: rgba(10,10,14,0.82)"></div>
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 1000px; background: rgba(10,10,14,0.35)"></div>

<header style="position: absolute; left: 96px; right: 96px; top: 48px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 56px">
<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 40px; font-weight: 900; letter-spacing: -1.5px">tony</span>
<span style="width: 11px; height: 11px; border-radius: 6px; background: {{accent}}; display: inline-block"></span>
</div>
<nav style="display: flex; gap: 40px; align-items: center">
<a href="#" style="text-decoration: none; font-size: 24px; font-weight: 700; color: #FFFFFF; border-bottom: 3px solid #FFFFFF; padding-bottom: 6px">Home</a>
<a href="#" style="text-decoration: none; font-size: 24px; font-weight: 500; color: #D1D1D6; padding-bottom: 9px">Favourites</a>
<a href="#" style="text-decoration: none; font-size: 24px; font-weight: 500; color: #D1D1D6; padding-bottom: 9px">Search</a>
<a href="#" style="text-decoration: none; font-size: 24px; font-weight: 500; color: #D1D1D6; padding-bottom: 9px">Settings</a>
</nav>
</div>
<span style="font-size: 24px; color: #E5E5EA; font-weight: 500">8:45 pm</span>
</header>

<div style="position: absolute; left: 96px; top: 250px; width: 880px; display: flex; flex-direction: column; gap: 20px">
<span style="display: inline-flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; letter-spacing: 2px">
<span style="width: 12px; height: 12px; border-radius: 6px; background: {{accent}}; display: inline-block"></span>LIVE NOW</span>
<h1 style="margin: 0; font-size: 120px; font-weight: 900; letter-spacing: -5px; line-height: 0.95">Al Jadeed</h1>
<span style="font-size: 28px; color: #E5E5EA; font-weight: 500">Channel 2 · Lebanon · General</span>
<span style="font-size: 22px; color: #C7C7CC">Press OK to watch full screen</span>
</div>

<div style="position: absolute; left: 96px; right: 0; bottom: 64px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; gap: 12px">
<span style="padding: 10px 24px; border-radius: 999px; background: #FFFFFF; color: #111114; font-size: 22px; font-weight: 700">Lebanon</span>
<span style="padding: 10px 24px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #E5E5EA; font-size: 22px; font-weight: 500">Australia</span>
<span style="padding: 10px 24px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #E5E5EA; font-size: 22px; font-weight: 500">Recently watched</span>
<span style="padding: 10px 24px; border-radius: 999px; background: rgba(255,255,255,0.12); color: #E5E5EA; font-size: 22px; font-weight: 500">News</span>
</div>
<div style="display: flex; gap: 28px; align-items: flex-end">
<sc-for list="{{row}}" as="ch" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 14px; flex: 0 0 auto">
<div style="{{ch.cardStyle}}">
<span style="{{ch.monoStyle}}">{{ch.mono}}</span>
<span style="position: absolute; left: 16px; top: 12px; font-size: 20px; font-weight: 800; color: {{ch.numColor}}">{{ch.num}}</span>
</div>
<span style="{{ch.labelStyle}}">{{ch.name}}</span>
</div>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#0A84FF","#30D158","#FF375F"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var row = [
      { num: '1', name: 'Tele Liban', mono: 'TL', ink: '#7A4B2A' },
      { num: '2', name: 'Al Jadeed', mono: 'AJ', ink: '#8C2F45', focused: true },
      { num: '3', name: 'LBCI', mono: 'LB', ink: '#3B3F8C' },
      { num: '4', name: 'MTV Lebanon', mono: 'MT', ink: '#1F5A96' },
      { num: '5', name: 'ABC News', mono: 'AB', ink: '#1F4F7A' },
      { num: '6', name: 'SBS', mono: 'SB', ink: '#2E6B4E' },
      { num: '7', name: 'France 24', mono: 'F24', ink: '#5A3F8C' }
    ].map(function (c) {
      var card = 'position: relative; width: 210px; height: 210px; border-radius: 28px; background: #F2F2F5; display: flex; align-items: center; justify-content: center;';
      var label = 'font-size: 21px; font-weight: 600; color: #C7C7CC; text-align: center;';
      if (c.focused) {
        card = 'position: relative; width: 250px; height: 250px; border-radius: 32px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px rgba(255,255,255,0.35), 0 28px 56px rgba(0,0,0,0.55);';
        label = 'font-size: 23px; font-weight: 800; color: #FFFFFF; text-align: center;';
      }
      return Object.assign({}, c, {
        cardStyle: card,
        labelStyle: label,
        monoStyle: 'font-size: ' + (c.focused ? 76 : 64) + 'px; font-weight: 900; letter-spacing: -2px; color: ' + c.ink + ';',
        numColor: '#6E6E73'
      });
    });
    return { accent: this.props.accent ?? '#FF9F0A', row: row };
  }
}
</script>
</body>
</html>
