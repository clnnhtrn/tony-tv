<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony home, version 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #262833; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 40px 96px 0 96px">
<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 40px; font-weight: 900; letter-spacing: -1.5px">tony</span>
<span style="width: 11px; height: 11px; border-radius: 6px; background: {{accent}}; display: inline-block"></span>
</div>
<nav style="display: flex; gap: 8px; padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.08)">
<a href="#" style="text-decoration: none; padding: 10px 26px; border-radius: 999px; background: rgba(255,255,255,0.92); color: #1A1B22; font-size: 22px; font-weight: 600">Home</a>
<a href="#" style="text-decoration: none; padding: 10px 26px; border-radius: 999px; color: #D1D1D6; font-size: 22px; font-weight: 500">Countries</a>
<a href="#" style="text-decoration: none; padding: 10px 26px; border-radius: 999px; color: #D1D1D6; font-size: 22px; font-weight: 500">Favourites</a>
<a href="#" aria-label="Search" style="text-decoration: none; padding: 10px 18px; border-radius: 999px; color: #D1D1D6; display: flex">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16" y2="16"></line></svg>
</a>
</nav>
<span style="font-size: 22px; color: #C7C7CC; font-weight: 500; width: 160px; text-align: right">8:45 pm</span>
</header>

<section style="margin-top: 44px; padding-left: 96px">
<h2 style="margin: 0 0 20px 0; font-size: 28px; font-weight: 700; letter-spacing: -0.3px">Keep watching</h2>
<div style="display: flex; gap: 36px">
<sc-for list="{{keep}}" as="ch" hint-placeholder-count="5">
<div style="{{ch.tileStyle}}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: {{ch.ground}}"></div>
<div style="position: absolute; right: 36px; top: 30px; width: 70px; height: 70px; border-radius: 35px; background: {{ch.sun}}"></div>
<div style="position: absolute; left: 22px; top: 20px; padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,0.35); font-size: 22px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.3px">{{ch.name}}</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px; background: rgba(12,13,18,0.55); display: flex; align-items: center; gap: 12px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; letter-spacing: 1px; color: #FFFFFF">
<span style="width: 9px; height: 9px; border-radius: 5px; background: {{accent}}; display: inline-block"></span>LIVE</span>
<span style="font-size: 19px; color: #F2F2F7; font-weight: 500">{{ch.now}}</span>
</div>
</div>
</sc-for>
</div>
</section>

<section style="margin-top: 52px; padding-left: 96px">
<h2 style="margin: 0 0 20px 0; font-size: 28px; font-weight: 700; letter-spacing: -0.3px">Your channels</h2>
<div style="display: flex; gap: 36px; align-items: flex-start">
<sc-for list="{{mine}}" as="ch" hint-placeholder-count="6">
<div style="{{ch.cardStyle}}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="flex: 1 1 auto; background: {{ch.sky}}"></div>
<div style="height: 38%; background: {{ch.ground}}"></div>
</div>
<span style="position: absolute; left: 18px; top: 6px; font-size: 92px; font-weight: 900; color: rgba(255,255,255,0.88); letter-spacing: -4px; line-height: 1">{{ch.num}}</span>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: rgba(12,13,18,0.5); padding-top: 18px">
<span style="font-size: 30px; font-weight: 900; color: #FFFFFF; letter-spacing: -0.5px; text-align: center">{{ch.name}}</span>
<span style="font-size: 19px; color: #E5E5EA; font-weight: 500">{{ch.genre}}</span>
</div>
</div>
</sc-for>
</div>
</section>

<section style="margin-top: 40px; padding-left: 96px">
<h2 style="margin: 0 0 20px 0; font-size: 28px; font-weight: 700; letter-spacing: -0.3px">Australia</h2>
<div style="display: flex; gap: 36px">
<sc-for list="{{aus}}" as="t" hint-placeholder-count="6">
<div style="flex: 0 0 auto; width: 248px; height: 120px; border-radius: 20px; background: {{t.bg}}"></div>
</sc-for>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#0A84FF","#30D158","#FF375F"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var keep = [
      { name: 'Al Jadeed', now: 'Evening news', bg: '#5B3A44', ground: '#3B2530', sun: '#E8A87C' },
      { name: 'ABC News', now: 'The World Today', bg: '#2F4E73', ground: '#1F3550', sun: '#9CC3E6' },
      { name: 'SBS', now: 'World Cup qualifier', bg: '#3E6250', ground: '#294236', sun: '#D9E4A3' },
      { name: 'Tele Liban', now: 'Morning talk show', bg: '#6B5240', ground: '#46352A', sun: '#F2C879' },
      { name: 'France 24', now: 'Le Journal', bg: '#4B4470', ground: '#312C4D', sun: '#C9B8F0' }
    ].map(function (c) {
      return Object.assign({}, c, { tileStyle: 'flex: 0 0 auto; position: relative; overflow: hidden; width: 324px; height: 182px; border-radius: 20px; background: ' + c.bg + '; box-shadow: 0 10px 24px rgba(0,0,0,0.25);' });
    });
    var mine = [
      { num: '1', name: 'Tele Liban', genre: 'General', sky: '#6B5240', ground: '#46352A', focused: true },
      { num: '2', name: 'Al Jadeed', genre: 'General', sky: '#5B3A44', ground: '#3B2530' },
      { num: '3', name: 'LBCI', genre: 'General', sky: '#46486E', ground: '#2E2F4A' },
      { num: '4', name: 'MTV Lebanon', genre: 'General', sky: '#2F4E73', ground: '#1F3550' },
      { num: '5', name: 'ABC News', genre: 'News', sky: '#3D5A80', ground: '#283C57' },
      { num: '6', name: 'SBS', genre: 'General', sky: '#3E6250', ground: '#294236' }
    ].map(function (c) {
      var s = 'flex: 0 0 auto; position: relative; overflow: hidden; width: 248px; height: 330px; border-radius: 22px; box-shadow: 0 10px 24px rgba(0,0,0,0.25);';
      if (c.focused) s += ' transform: scale(1.1); transform-origin: left center; margin-right: 26px; box-shadow: 0 0 0 5px rgba(255,255,255,0.95), 0 26px 50px rgba(0,0,0,0.5);';
      return Object.assign({}, c, { cardStyle: s });
    });
    var aus = ['#2F4E73', '#3E6250', '#6B5240', '#46486E', '#2A4F55', '#5B3A44'].map(function (b) { return { bg: b }; });
    return { accent: this.props.accent ?? '#FF9F0A', keep: keep, mine: mine, aus: aus };
  }
}
</script>
</body>
</html>
