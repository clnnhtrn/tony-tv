<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony v6 — Hero follows focus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15161B}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; background: #15161B; font-family: Inter, system-ui, sans-serif; color: #F5F5F7">
  <dc-import name="Main" focus-tile="{{one}}" accent="{{accent}}" hint-size="1920px,1080px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#0A84FF","#30D158","#FF375F"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { one: 1, accent: this.props.accent ?? "#FF9F0A" };
  }
}
</script>
</body>
</html>
