<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony v6 — Home with hero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15161B}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #15161B; font-family: Inter, system-ui, sans-serif; color: #F5F5F7">

  <!-- HERO: the featured channel's live picture (muted), faded into the page on the left and bottom -->
  <div style="position: absolute; left: 0; top: 0; width: 1920px; height: 760px">
    <img src="{{hero.still}}" alt="" style="position: absolute; right: 0; top: 0; width: 1350px; height: 760px; object-fit: cover">
    <div style="position: absolute; inset: 0; background: linear-gradient(90deg, #15161B 0%, #15161B 28%, rgba(21,22,27,0.82) 44%, rgba(21,22,27,0.25) 66%, rgba(21,22,27,0) 80%)"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(180deg, rgba(21,22,27,0) 0%, rgba(21,22,27,0.75) 55%, #15161B 100%)"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 180px; background: linear-gradient(180deg, rgba(21,22,27,0.7) 0%, rgba(21,22,27,0) 100%)"></div>
  </div>

  <!-- HEADER -->
  <header style="position: absolute; left: 104px; right: 104px; top: 48px; height: 56px; display: flex; align-items: center; gap: 56px">
    <div style="display: flex; align-items: baseline; gap: 3px">
      <span style="font-size: 40px; font-weight: 900; letter-spacing: -1px; color: #FFFFFF">tony</span>
      <span style="width: 11px; height: 11px; border-radius: 999px; background: {{accent}}; display: inline-block"></span>
    </div>
    <nav style="display: flex; gap: 8px">
      <a href="#" style="text-decoration: none; padding: 10px 24px; border-radius: 999px; background: #FFFFFF; color: #15161B; font-size: 21px; font-weight: 600">Home</a>
      <a href="#" style="text-decoration: none; padding: 10px 24px; border-radius: 999px; color: #C7C7CC; font-size: 21px; font-weight: 500">Favourites</a>
      <a href="#" style="text-decoration: none; padding: 10px 24px; border-radius: 999px; color: #C7C7CC; font-size: 21px; font-weight: 500">Search</a>
    </nav>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 22px; font-weight: 500; color: #C7C7CC">7:42</span>
    <button aria-label="Settings" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>

  <!-- HERO TEXT -->
  <section style="position: absolute; left: 104px; top: 236px; width: 760px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px; background: rgba(0,0,0,0.45); font-size: 15px; font-weight: 800; letter-spacing: 1.2px; color: #FFFFFF">
        <span style="width: 9px; height: 9px; border-radius: 999px; background: {{accent}}; display: inline-block"></span>LIVE
      </span>
      <span style="font-size: 20px; font-weight: 500; color: #C7C7CC">{{hero.meta}}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 22px">
      <div style="{{hero.badgeStyle}}"><img src="{{hero.logo}}" alt="" style="{{hero.logoStyle}}"></div>
      <h1 style="margin: 0; font-size: 72px; line-height: 1.02; font-weight: 800; letter-spacing: -1.5px; color: #FFFFFF">{{hero.name}}</h1>
    </div>
    <p style="margin: 0; font-size: 22px; line-height: 1.45; color: #C7C7CC; max-width: 640px">{{hero.desc}}</p>
    <div style="display: flex; gap: 16px; margin-top: 10px">
      <button style="{{watchStyle}}">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="#15161B"></path></svg>Watch
      </button>
      <button style="display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 30px; border-radius: 999px; border: 0; background: rgba(42,43,51,0.88); color: #FFFFFF; font-family: Inter, system-ui, sans-serif; font-size: 22px; font-weight: 600">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.1 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.6 0 5.7 3.6 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="{{accent}}"></path></svg>In Favourites
      </button>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 18px" aria-hidden="true">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="{{d.style}}"></span></sc-for>
    </div>
  </section>

  <!-- FAVOURITES ROW -->
  <section style="position: absolute; left: 104px; top: 712px; width: 1816px">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 18px">
      <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #F5F5F7">Favourites</h2>
      <span style="padding: 3px 11px; border-radius: 999px; background: #24252D; font-size: 16px; font-weight: 600; color: #AEAEB2">5</span>
    </div>
    <div style="display: flex; gap: 28px">
      <sc-for list="{{favs}}" as="c" hint-placeholder-count="5">
        <div style="flex: 0 0 400px; display: flex; flex-direction: column; gap: 12px">
          <div style="{{c.tileStyle}}">
            <img src="{{c.still}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%)"></div>
            <div style="{{c.badgeStyle}}"><img src="{{c.logo}}" alt="" style="{{c.logoStyle}}"></div>
            <span style="position: absolute; left: 16px; bottom: 14px; display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; background: rgba(0,0,0,0.55); font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #FFFFFF">
              <span style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}}; display: inline-block"></span>LIVE
            </span>
            <sc-if value="{{c.hd}}" hint-placeholder-val="{{true}}"><span style="position: absolute; right: 14px; top: 14px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,0.55); font-size: 12px; font-weight: 800; letter-spacing: 0.8px; color: #FFFFFF">HD</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 3px; padding-left: 2px">
            <span style="{{c.nameStyle}}">{{c.name}}</span>
            <span style="font-size: 17px; font-weight: 500; color: #8E8E93">{{c.sub}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#0A84FF","#30D158","#FF375F"]},"focusTile":{"editor":"int","default":-1,"min":-1,"max":4},"$preview":{"width":1920,"height":1080}}'>
const CH = {
  mtv:   { name: "MTV Lebanon", country: "Lebanon", num: 1, cat: "General", hd: true, still: "/_blob/b2d095bdaca9d4df9a35791efd3b3942", logo: "/_blob/0d318f70c3365038d2c1d3fd075ea771", w: 200, h: 77, badge: "fill", bc: "#1C2454", desc: "News, talk shows, series and entertainment from Lebanon." },
  lbci:  { name: "LBC International", country: "Lebanon", num: 20, cat: "General", hd: true, still: "/_blob/af1d23b9866183a70d30f0c35bec2994", logo: "/_blob/90cf72046ee430f57f41a1f893baa739", w: 67, h: 160, badge: "fill", bc: "#ECECEC", desc: "Lebanon's long-running general channel: news, drama and talk." },
  jadeed:{ name: "Al Jadeed", country: "Lebanon", num: 17, cat: "General", hd: true, still: "/_blob/d4968ed879b3b907ccc1a5bfd49ec84d", logo: "/_blob/be6ea5ac2ede69f358996f44912db428", w: 320, h: 123, badge: "dark", bc: "#0B0C10", desc: "Lebanese news, current affairs and entertainment." },
  abcn:  { name: "ABC News", country: "Australia", num: 13, cat: "News", hd: true, still: "/_blob/eb3dabe92cb8732f49a46bf44132239d", logo: "/_blob/2347b2824e62406604e77cc28e32cc32", w: 289, h: 160, badge: "dark", bc: "#0B0C10", desc: "Australian and world news, around the clock." },
  sbs:   { name: "SBS", country: "Australia", num: 6, cat: "General", hd: true, still: "/_blob/7484ba2ccdaaf46ebd328dab4b7ce02d", logo: "/_blob/13c9b881f4bf90eaab415e2153a12484", w: 320, h: 154, badge: "light", bc: "#FFFFFF", desc: "World news, documentaries, film and food." }
};
const FAVS = ["mtv", "lbci", "jadeed", "abcn", "sbs"];

function logoBox(c, area, maxW, maxH) {
  const a = c.w / c.h;
  let w = Math.sqrt(area * a), h = w / a;
  const k = Math.min(1, maxW / w, maxH / h);
  return { w: Math.round(w * k), h: Math.round(h * k) };
}
function badge(c, area, maxW, maxH, pad, radius, pos) {
  const b = logoBox(c, area, maxW, maxH);
  const line = c.badge === "light" ? "" : " box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);";
  return {
    badgeStyle: pos + " display: inline-flex; align-items: center; justify-content: center; padding: " + pad + "; border-radius: " + radius + "px; background: " + c.bc + ";" + line,
    logoStyle: "display: block; width: " + b.w + "px; height: " + b.h + "px; object-fit: contain"
  };
}

class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? "#FF9F0A";
    const focus = this.props.focusTile ?? -1;
    const heroKey = focus >= 0 ? FAVS[focus] : "mtv";
    const h = CH[heroKey];
    const hb = badge(h, 120 * 36 * 2.4, 230, 84, "12px 16px", 14, "");
    const ring = "box-shadow: 0 0 0 4px #15161B, 0 0 0 8px #FFFFFF, 0 18px 40px rgba(0,0,0,0.55);";
    const favs = FAVS.map((k, i) => {
      const c = CH[k];
      const focused = i === focus;
      const tb = badge(c, 120 * 36, 150, 52, "10px 12px", 10, "position: absolute; left: 16px; top: 16px;");
      return Object.assign({}, c, tb, {
        sub: c.country + " · Channel " + c.num,
        tileStyle: "position: relative; width: 400px; height: 225px; border-radius: 20px; overflow: hidden; background: #24252D;" + (focused ? " transform: scale(1.08); transform-origin: center top; " + ring : ""),
        nameStyle: focused ? "font-size: 22px; font-weight: 700; color: #FFFFFF; margin-top: " + (focused ? "18px" : "0") : "font-size: 22px; font-weight: 500; color: #AEAEB2"
      });
    });
    const watchFocused = focus < 0;
    return {
      accent,
      hero: Object.assign({}, h, hb, { meta: "Channel " + h.num + "  ·  " + h.country + "  ·  " + h.cat + (h.hd ? "  ·  HD" : "") }),
      favs,
      dots: FAVS.map((k) => ({ style: k === heroKey ? "width: 28px; height: 5px; border-radius: 3px; background: #FFFFFF; display: inline-block" : "width: 10px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.32); display: inline-block" })),
      watchStyle: "display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 34px; border-radius: 999px; border: 0; background: #FFFFFF; color: #15161B; font-family: Inter, system-ui, sans-serif; font-size: 22px; font-weight: 700;" + (watchFocused ? " transform: scale(1.06); box-shadow: 0 0 0 4px #15161B, 0 0 0 8px #FFFFFF, 0 12px 30px rgba(0,0,0,0.5);" : ""),
      true: true
    };
  }
}
</script>
</body>
</html>
