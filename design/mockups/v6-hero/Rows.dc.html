<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony v6 — Scrolled into rows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15161B}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #15161B; font-family: Inter, system-ui, sans-serif; color: #F5F5F7">

  <header style="position: absolute; left: 104px; right: 104px; top: 48px; height: 56px; display: flex; align-items: center; gap: 56px">
    <div style="display: flex; align-items: baseline; gap: 3px">
      <span style="font-size: 40px; font-weight: 900; letter-spacing: -1px; color: #FFFFFF">tony</span>
      <span style="width: 11px; height: 11px; border-radius: 999px; background: {{accent}}; display: inline-block"></span>
    </div>
    <nav style="display: flex; gap: 8px">
      <a href="#" style="text-decoration: none; padding: 10px 24px; border-radius: 999px; background: #2A2B33; color: #FFFFFF; font-size: 21px; font-weight: 600">Home</a>
      <a href="#" style="text-decoration: none; padding: 10px 24px; border-radius: 999px; color: #C7C7CC; font-size: 21px; font-weight: 500">Favourites</a>
      <a href="#" style="text-decoration: none; padding: 10px 24px; border-radius: 999px; color: #C7C7CC; font-size: 21px; font-weight: 500">Search</a>
    </nav>
    <div style="flex-grow: 1"></div>
    <span style="font-size: 22px; font-weight: 500; color: #C7C7CC">7:42</span>
    <button aria-label="Settings" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C7C7CC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>

  <section style="position: absolute; left: 104px; top: 140px; width: 1816px">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 18px">
      <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #F5F5F7">Favourites</h2>
      <span style="padding: 3px 11px; border-radius: 999px; background: #24252D; font-size: 16px; font-weight: 600; color: #AEAEB2">5</span>
    </div>
    <div style="display: flex; gap: 28px">
      <sc-for list="{{favs}}" as="c" hint-placeholder-count="5">
        <div style="flex: 0 0 400px; display: flex; flex-direction: column; gap: 12px">
          <div style="position: relative; width: 400px; height: 225px; border-radius: 20px; overflow: hidden; background: #24252D">
            <img src="{{c.still}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
            <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%)"></div>
            <div style="{{c.badgeStyle}}"><img src="{{c.logo}}" alt="" style="{{c.logoStyle}}"></div>
            <span style="position: absolute; left: 16px; bottom: 14px; display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; background: rgba(0,0,0,0.55); font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #FFFFFF">
              <span style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}}; display: inline-block"></span>LIVE
            </span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 3px; padding-left: 2px">
            <span style="font-size: 22px; font-weight: 500; color: #AEAEB2">{{c.name}}</span>
            <span style="font-size: 17px; font-weight: 500; color: #8E8E93">{{c.sub}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
    <section style="{{r.pos}}">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 18px">
        <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #F5F5F7">{{r.title}}</h2>
        <sc-if value="{{r.count}}" hint-placeholder-val="{{r.count}}"><span style="padding: 3px 11px; border-radius: 999px; background: #24252D; font-size: 16px; font-weight: 600; color: #AEAEB2">{{r.count}}</span></sc-if>
      </div>
      <div style="display: flex; gap: 28px">
        <sc-for list="{{r.items}}" as="c" hint-placeholder-count="7">
          <div style="flex: 0 0 250px; display: flex; flex-direction: column; gap: 10px">
            <div style="{{c.tileStyle}}">
              <img src="{{c.still}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
              <div style="{{c.badgeStyle}}"><img src="{{c.logo}}" alt="" style="{{c.logoStyle}}"></div>
              <sc-if value="{{c.fav}}" hint-placeholder-val="{{c.fav}}">
                <span aria-label="In Favourites" style="position: absolute; right: 10px; bottom: 10px; width: 30px; height: 30px; border-radius: 999px; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center">
                  <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.1 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.6 0 5.7 3.6 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="{{accent}}"></path></svg>
                </span>
              </sc-if>
            </div>
            <span style="{{c.nameStyle}}">{{c.name}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#0A84FF","#30D158","#FF375F"]},"$preview":{"width":1920,"height":1080}}'>
const CH = {
  mtv:    { name: "MTV Lebanon", country: "Lebanon", num: 1, still: "/_blob/b2d095bdaca9d4df9a35791efd3b3942", logo: "/_blob/0d318f70c3365038d2c1d3fd075ea771", w: 200, h: 77, badge: "fill", bc: "#1C2454" },
  tl:     { name: "Tele Liban", country: "Lebanon", num: 2, still: "/_blob/cab351097ef467067a8da263ad5d5531", logo: "/_blob/0cf18001211519d4ddb0b0ca8e4a1fa6", w: 80, h: 111, badge: "fill", bc: "#EC1C24" },
  may:    { name: "Al Mayadeen", country: "Lebanon", num: 4, still: "/_blob/eba9761248d35f66ecbd14cbcd45c4cf", logo: "/_blob/5e2a4d3f6d9ea6bb48f9eaeb09cb2947", w: 269, h: 77, badge: "light", bc: "#FFFFFF" },
  vol:    { name: "Voice of Lebanon", country: "Lebanon", num: 5, still: "/_blob/d41acbe42534ede094a6187304b71153", logo: "/_blob/baafe3852abbb38849e448112efbbaec", w: 320, h: 68, badge: "light", bc: "#FFFFFF" },
  jadeed: { name: "Al Jadeed", country: "Lebanon", num: 17, still: "/_blob/d4968ed879b3b907ccc1a5bfd49ec84d", logo: "/_blob/be6ea5ac2ede69f358996f44912db428", w: 320, h: 123, badge: "dark", bc: "#0B0C10" },
  lana:   { name: "Lana TV", country: "Lebanon", num: 19, still: "/_blob/c8f2221fd0088319c70146ee373aedd6", logo: "/_blob/7a8119af4c0df1a0db83eb1f4a82f44c", w: 174, h: 160, badge: "light", bc: "#FFFFFF" },
  lbci:   { name: "LBC International", country: "Lebanon", num: 20, still: "/_blob/af1d23b9866183a70d30f0c35bec2994", logo: "/_blob/90cf72046ee430f57f41a1f893baa739", w: 67, h: 160, badge: "fill", bc: "#ECECEC" },
  otv:    { name: "OTV", country: "Lebanon", num: 24, still: "/_blob/f2f2137be2335b533bf72c950f912c16", logo: "/_blob/91daf41e4efa65b28fb3112aac86641b", w: 320, h: 125, badge: "light", bc: "#FFFFFF" },
  red:    { name: "Red TV", country: "Lebanon", num: 26, still: "/_blob/18907cff1f117fe3d1555662cc299f09", logo: "/_blob/576b57ff90a543d4ca7b01e7c2975503", w: 160, h: 160, badge: "light", bc: "#FFFFFF" },
  abcn:   { name: "ABC News", country: "Australia", num: 13, still: "/_blob/eb3dabe92cb8732f49a46bf44132239d", logo: "/_blob/2347b2824e62406604e77cc28e32cc32", w: 289, h: 160, badge: "dark", bc: "#0B0C10" },
  sbs:    { name: "SBS", country: "Australia", num: 6, still: "/_blob/7484ba2ccdaaf46ebd328dab4b7ce02d", logo: "/_blob/13c9b881f4bf90eaab415e2153a12484", w: 320, h: 154, badge: "light", bc: "#FFFFFF" },
  seven:  { name: "Seven", country: "Australia", num: 7, still: "/_blob/1d475c4a13af0892eb57a4da473d3211", logo: "/_blob/31149dcc7ccb6e1e6495b01e6a112a9f", w: 153, h: 160, badge: "light", bc: "#FFFFFF" },
  nine:   { name: "Nine", country: "Australia", num: 2, still: "/_blob/1ab18ce891af9278f3f275e8add9a91c", logo: "/_blob/6a0452376336fea503442700d52e9926", w: 160, h: 47, badge: "light", bc: "#FFFFFF" },
  gem:    { name: "9Gem", country: "Australia", num: 22, still: "/_blob/dd52e63175434d29adaa0f77c00263ee", logo: "/_blob/b7c9bf50a766822f6680fd41bb0367f2", w: 320, h: 89, badge: "light", bc: "#FFFFFF" },
  food:   { name: "SBS Food", country: "Australia", num: 16, still: "/_blob/abf7415aaa70ab625a78f225ec041a77", logo: "/_blob/4abe2895ff3f76f1a617beda59ecd63a", w: 320, h: 107, badge: "light", bc: "#FFFFFF" }
};
const FAVS = ["mtv", "lbci", "jadeed", "abcn", "sbs"];

function badge(c, area, maxW, maxH, pad, radius, pos) {
  const a = c.w / c.h;
  let w = Math.sqrt(area * a), h = w / a;
  const k = Math.min(1, maxW / w, maxH / h);
  const line = c.badge === "light" ? "" : " box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);";
  return {
    badgeStyle: pos + " display: inline-flex; align-items: center; justify-content: center; padding: " + pad + "; border-radius: " + radius + "px; background: " + c.bc + ";" + line,
    logoStyle: "display: block; width: " + Math.round(w * k) + "px; height: " + Math.round(h * k) + "px; object-fit: contain"
  };
}

class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? "#FF9F0A";
    const ring = " transform: scale(1.08); transform-origin: center top; box-shadow: 0 0 0 4px #15161B, 0 0 0 8px #FFFFFF, 0 16px 34px rgba(0,0,0,0.55);";
    const small = (k, focused) => {
      const c = CH[k];
      return Object.assign({}, c, badge(c, 120 * 36 * 0.55, 104, 38, "7px 9px", 8, "position: absolute; left: 12px; top: 12px;"), {
        fav: FAVS.indexOf(k) >= 0,
        tileStyle: "position: relative; width: 250px; height: 140px; border-radius: 18px; overflow: hidden; background: #24252D;" + (focused ? ring : ""),
        nameStyle: focused ? "font-size: 20px; font-weight: 700; color: #FFFFFF; margin-top: 12px" : "font-size: 20px; font-weight: 500; color: #8E8E93"
      });
    };
    const favs = FAVS.map((k) => Object.assign({}, CH[k], badge(CH[k], 120 * 36, 150, 52, "10px 12px", 10, "position: absolute; left: 16px; top: 16px;"), { sub: CH[k].country + " · Channel " + CH[k].num }));
    return {
      accent,
      favs,
      rows: [
        { title: "Recent", count: "", pos: "position: absolute; left: 104px; top: 528px; width: 1816px", items: ["tl", "seven", "may", "mtv", "otv", "nine", "gem"].map((k, i) => small(k, i === 0)) },
        { title: "Lebanon", count: "32", pos: "position: absolute; left: 104px; top: 826px; width: 1816px", items: ["mtv", "tl", "may", "vol", "jadeed", "lana", "lbci", "otv", "red"].map((k) => small(k, false)) }
      ]
    };
  }
}
</script>
</body>
</html>
