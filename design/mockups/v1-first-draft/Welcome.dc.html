<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony first-run country picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #0B0B0F; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 96px 160px 72px 160px">

<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 56px; font-weight: 800; letter-spacing: -2px">tony</span>
<span style="width: 14px; height: 14px; border-radius: 7px; background: {{accent}}; display: inline-block"></span>
</div>
<h1 style="margin: 40px 0 0 0; font-size: 64px; font-weight: 800; letter-spacing: -2px; text-align: center">Which countries do you want to watch?</h1>
<p style="margin: 18px 0 0 0; font-size: 28px; color: #A1A1A8; text-align: center">Pick as many as you like. You can change this later in Settings.</p>

<div style="margin-top: 64px; width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px">
<sc-for list="{{countries}}" as="c" hint-placeholder-count="12">
<button type="button" aria-pressed="{{c.pressed}}" style="{{c.cardStyle}}">
<span style="font-size: 30px; font-weight: 700; color: #F5F5F7">{{c.name}}</span>
<span style="display: flex; align-items: center; justify-content: space-between; width: 100%">
<span style="font-size: 22px; color: #A1A1A8; font-weight: 500">{{c.count}}</span>
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}">
<span style="width: 40px; height: 40px; border-radius: 20px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12 10 17 19 7"></polyline></svg>
</span>
</sc-if>
<sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}">
<span style="width: 40px; height: 40px; border-radius: 20px; box-sizing: border-box; border: 3px solid #48484F; display: inline-block"></span>
</sc-if>
</span>
</button>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; align-items: center; gap: 32px">
<span style="font-size: 24px; color: #A1A1A8">2 countries selected</span>
<a href="Main.dc.html" style="text-decoration: none; padding: 20px 64px; border-radius: 14px; background: #F5F5F7; color: #0B0B0F; font-size: 28px; font-weight: 700">Continue</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#0A84FF","#30D158","#FF375F"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['Lebanon', 'X', true, false], ['Australia', 'X', true, true], ['United Kingdom', 'X'], ['France', 'X'],
      ['United States', 'X'], ['Italy', 'X'], ['Greece', 'X'], ['Germany', 'X'],
      ['Canada', 'X'], ['Spain', 'X'], ['Turkey', 'X'], ['More countries', '']
    ];
    var countries = list.map(function (r) {
      var on = !!r[2], focused = !!r[3];
      var s = 'all: unset; box-sizing: border-box; height: 132px; border-radius: 20px; padding: 24px 28px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; cursor: pointer; font-family: inherit; ';
      s += on ? 'background: #24242B;' : 'background: #16161C;';
      if (focused) s += ' transform: scale(1.05); box-shadow: 0 0 0 5px #F5F5F7, 0 20px 40px rgba(0,0,0,0.6);';
      return { name: r[0], count: r[1] === 'X' ? '[#] channels' : 'Browse all', on: on, off: !on, pressed: on ? 'true' : 'false', cardStyle: s };
    });
    return { accent: this.props.accent ?? '#FF9F0A', countries: countries };
  }
}
</script>
</body>
</html>
