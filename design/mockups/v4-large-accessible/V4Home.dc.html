<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony home, version 4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #121318; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; padding: 56px 112px 0 112px">

<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 52px; font-weight: 900; letter-spacing: -2px">tony</span>
<span style="width: 14px; height: 14px; border-radius: 7px; background: {{accent}}; display: inline-block"></span>
</div>
<span style="font-size: 36px; font-weight: 600; color: #E5E5EA">8:45 pm</span>
</header>

<h1 style="margin: 48px 0 0 0; font-size: 56px; font-weight: 800; letter-spacing: -1.5px">Good evening</h1>

<div style="margin-top: 36px; display: flex; gap: 16px">
<span style="padding: 16px 34px; border-radius: 999px; background: #FFFFFF; color: #121318; font-size: 30px; font-weight: 700">Lebanon</span>
<span style="padding: 16px 34px; border-radius: 999px; background: #262833; color: #F5F5F7; font-size: 30px; font-weight: 600">Australia</span>
<span style="padding: 16px 34px; border-radius: 999px; background: #262833; color: #F5F5F7; font-size: 30px; font-weight: 600">Favourites</span>
<span style="padding: 16px 34px; border-radius: 999px; background: #262833; color: #F5F5F7; font-size: 30px; font-weight: 600">Search</span>
</div>

<div style="margin-top: 56px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 48px">
<sc-for list="{{tiles}}" as="ch" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="{{ch.cardStyle}}">
<span style="{{ch.monoStyle}}">{{ch.mono}}</span>
<span style="position: absolute; left: 22px; top: 16px; font-size: 30px; font-weight: 800; color: #48484F">{{ch.num}}</span>
<sc-if value="{{ch.focused}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 18px; top: 18px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #121318; color: #FFFFFF; font-size: 20px; font-weight: 800; letter-spacing: 1px">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{accent}}; display: inline-block"></span>LIVE</span>
</sc-if>
</div>
<span style="{{ch.nameStyle}}">{{ch.name}}</span>
</div>
</sc-for>
</div>

<div style="margin-top: auto; margin-left: -112px; margin-right: -112px; padding: 28px 112px; background: #1C1D24; display: flex; align-items: center; gap: 64px">
<span style="display: inline-flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 600">
<span style="width: 52px; height: 52px; border-radius: 26px; background: #FFFFFF; color: #121318; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900">OK</span>Watch</span>
<span style="display: inline-flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 600">
<span style="width: 52px; height: 52px; border-radius: 26px; background: #3A3B45; display: inline-flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 3 12 9 18"></polyline><polyline points="15 6 21 12 15 18"></polyline></svg>
</span>Move</span>
<span style="display: inline-flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 600">
<span style="width: 52px; height: 52px; border-radius: 26px; background: #3A3B45; display: inline-flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
</span>Go back</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#0A84FF","#30D158","#FF375F"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#FF9F0A';
    var tiles = [
      { num: '1', name: 'Tele Liban', mono: 'TL', ink: '#7A4B2A', focused: true },
      { num: '2', name: 'Al Jadeed', mono: 'AJ', ink: '#8C2F45' },
      { num: '3', name: 'LBCI', mono: 'LB', ink: '#3B3F8C' },
      { num: '4', name: 'MTV Lebanon', mono: 'MT', ink: '#1F5A96' }
    ].map(function (c) {
      var card = 'position: relative; height: 270px; border-radius: 32px; background: #F2F2F5; display: flex; align-items: center; justify-content: center;';
      var name = 'font-size: 36px; font-weight: 700; color: #C7C7CC; text-align: center;';
      if (c.focused) {
        card = 'position: relative; height: 270px; border-radius: 32px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; transform: scale(1.08); box-shadow: 0 0 0 7px #121318, 0 0 0 14px ' + accent + ', 0 30px 60px rgba(0,0,0,0.6);';
        name = 'font-size: 38px; font-weight: 800; color: #FFFFFF; text-align: center; margin-top: 10px;';
      }
      return Object.assign({}, c, {
        cardStyle: card,
        nameStyle: name,
        monoStyle: 'font-size: 96px; font-weight: 900; letter-spacing: -3px; color: ' + c.ink + ';',
        focused: !!c.focused
      });
    });
    return { accent: accent, tiles: tiles };
  }
}
</script>
</body>
</html>
