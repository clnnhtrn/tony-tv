<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #15161B; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; padding: 48px 0 0 104px">

<header style="display: flex; align-items: center; justify-content: space-between; padding-right: 104px">
<div style="display: flex; align-items: center; gap: 64px">
<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 38px; font-weight: 900; letter-spacing: -1.5px">tony</span>
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{accent}}; display: inline-block"></span>
</div>
<nav style="display: flex; gap: 10px">
<a href="V5Home.dc.html" style="text-decoration: none; padding: 10px 24px; border-radius: 999px; background: #FFFFFF; color: #15161B; font-size: 21px; font-weight: 600">Home</a>
<a href="V5Favourites.dc.html" style="text-decoration: none; padding: 10px 24px; border-radius: 999px; color: #C7C7CC; font-size: 21px; font-weight: 500">Favourites</a>
<a href="V5Search.dc.html" style="text-decoration: none; padding: 10px 24px; border-radius: 999px; color: #C7C7CC; font-size: 21px; font-weight: 500">Search</a>
</nav>
</div>
<div style="display: flex; align-items: center; gap: 28px">
<span style="font-size: 22px; color: #C7C7CC; font-weight: 500">8:45 pm</span>
<a href="V5Settings.dc.html" aria-label="Settings" style="color: #C7C7CC; display: flex">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="17" x2="20" y2="17"></line><circle cx="9" cy="7" r="2.5" fill="#15161B"></circle><circle cx="15" cy="17" r="2.5" fill="#15161B"></circle></svg>
</a>
</div>
</header>

<section style="margin-top: 52px">
<h2 style="margin: 0 0 18px 0; font-size: 24px; font-weight: 700">Favourites</h2>
<div style="display: flex; gap: 28px">
<sc-for list="{{keep}}" as="ch" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="{{ch.tileStyle}}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: {{ch.ground}}"></div>
<div style="position: absolute; right: 40px; top: 34px; width: 64px; height: 64px; border-radius: 32px; background: {{ch.sun}}"></div>
<span style="position: absolute; left: 16px; top: 16px; padding: 6px 10px; border-radius: 10px; background: #FFFFFF; font-size: 18px; font-weight: 900; color: {{ch.ink}}">{{ch.mono}}</span>
<span style="position: absolute; left: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,0.5); font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #FFFFFF">
<span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}; display: inline-block"></span>LIVE</span>
</div>
<span style="font-size: 21px; font-weight: 600; color: #F2F2F7">{{ch.name}}</span>
</div>
</sc-for>
</div>
</section>

<section style="margin-top: 44px">
<h2 style="margin: 0 0 18px 0; font-size: 24px; font-weight: 700">Recent</h2>
<div style="display: flex; gap: 28px">
<sc-for list="{{leb}}" as="ch" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="{{ch.cardStyle}}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: {{ch.ground}}"></div>
<span style="position: absolute; left: 12px; top: 12px; padding: 4px 9px; border-radius: 8px; background: #FFFFFF; font-size: 16px; font-weight: 900; color: {{ch.ink}}">{{ch.mono}}</span>
<sc-if value="{{ch.fav}}" hint-placeholder-val="{{ false }}">
<span aria-label="Favourite" style="position: absolute; right: 12px; top: 12px; width: 30px; height: 30px; border-radius: 15px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.3 5.3 3.2 1.7-1.9 3.1-3.2 5.3-3.2 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"></path></svg>
</span>
</sc-if>
</div>
<span style="{{ch.nameStyle}}">{{ch.name}}</span>
</div>
</sc-for>
</div>
</section>

<section style="margin-top: 44px">
<h2 style="margin: 0 0 18px 0; font-size: 24px; font-weight: 700">Lebanon</h2>
<div style="display: flex; gap: 28px">
<sc-for list="{{aus}}" as="ch" hint-placeholder-count="6">
<div style="position: relative; overflow: hidden; width: 250px; height: 100px; border-radius: 18px 18px 0 0; background: {{ch.bg}}">
<span style="position: absolute; left: 12px; top: 12px; padding: 4px 9px; border-radius: 8px; background: #FFFFFF; font-size: 16px; font-weight: 900; color: {{ch.ink}}">{{ch.mono}}</span>
</div>
</sc-for>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#0A84FF","#30D158","#FF375F"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var keep = [
      { name: 'Al Jadeed', mono: 'AJ', ink: '#8C2F45', bg: '#5B3A44', ground: '#3B2530', sun: '#E8A87C' },
      { name: 'ABC News', mono: 'ABC', ink: '#1F4F7A', bg: '#2F4E73', ground: '#1F3550', sun: '#9CC3E6' },
      { name: 'Tele Liban', mono: 'TL', ink: '#7A4B2A', bg: '#6B5240', ground: '#46352A', sun: '#F2C879' },
      { name: 'SBS', mono: 'SBS', ink: '#2E6B4E', bg: '#3E6250', ground: '#294236', sun: '#D9E4A3' }
    ].map(function (c) {
      return Object.assign({}, c, { tileStyle: 'position: relative; overflow: hidden; width: 400px; height: 225px; border-radius: 20px; background: ' + c.bg + ';' });
    });
    var leb = [
      { name: 'France 24', mono: 'F24', ink: '#5A3F8C', bg: '#4B4470', ground: '#312C4D', focused: true },
      { name: 'Al Jadeed', mono: 'AJ', ink: '#8C2F45', bg: '#5B3A44', ground: '#3B2530', fav: true },
      { name: 'LBCI', mono: 'LB', ink: '#3B3F8C', bg: '#46486E', ground: '#2E2F4A' },
      { name: 'ABC News', mono: 'ABC', ink: '#1F4F7A', bg: '#2F4E73', ground: '#1F3550', fav: true },
      { name: 'Channel 9', mono: '9', ink: '#1F5A96', bg: '#36506E', ground: '#24384F' },
      { name: 'Tele Liban', mono: 'TL', ink: '#7A4B2A', bg: '#6B5240', ground: '#46352A', fav: true }
    ].map(function (c) {
      var card = 'position: relative; overflow: hidden; width: 250px; height: 140px; border-radius: 18px; background: ' + c.bg + ';';
      var name = 'font-size: 21px; font-weight: 500; color: #AEAEB2;';
      if (c.focused) {
        card += ' transform: scale(1.08); box-shadow: 0 0 0 4px #15161B, 0 0 0 8px #FFFFFF, 0 20px 40px rgba(0,0,0,0.5);';
        name = 'font-size: 21px; font-weight: 700; color: #FFFFFF; margin-top: 6px;';
      }
      return Object.assign({}, c, { cardStyle: card, nameStyle: name, fav: !!c.fav });
    });
    var aus = [
      { mono: 'TL', ink: '#7A4B2A', bg: '#6B5240' }, { mono: 'AJ', ink: '#8C2F45', bg: '#5B3A44' }, { mono: 'LB', ink: '#3B3F8C', bg: '#46486E' },
      { mono: 'MT', ink: '#1F5A96', bg: '#2F4E73' }, { mono: '··', ink: '#636366', bg: '#3A3B45' }, { mono: '··', ink: '#636366', bg: '#3A3B45' }
    ];
    return { accent: this.props.accent ?? '#FF9F0A', keep: keep, leb: leb, aus: aus };
  }
}
</script>
</body>
</html>
