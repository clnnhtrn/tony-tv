<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tony channel details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F7}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #15161B; color: #F5F5F7; font-family: Inter, system-ui, sans-serif">

<div style="position: absolute; right: 0; top: 0; width: 1180px; height: 664px; overflow: hidden; background: #6B5240">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: #46352A"></div>
<div style="position: absolute; right: 180px; top: 110px; width: 150px; height: 150px; border-radius: 75px; background: #F2C879"></div>
<span style="position: absolute; right: 48px; bottom: 32px; font-size: 20px; color: #F3E7DC">Live preview, muted</span>
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 220px; background: rgba(21,22,27,0.6)"></div>
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 90px; background: #15161B"></div>
</div>

<div style="position: absolute; left: 50%; top: 40px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 14px; padding: 14px 26px; border-radius: 999px; background: #F5F5F7; color: #15161B; font-size: 21px; font-weight: 600; box-shadow: 0 14px 30px rgba(0,0,0,0.45)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="{{accent}}" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.3 5.3 3.2 1.7-1.9 3.1-3.2 5.3-3.2 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"></path></svg>
Added to Favourites</div>

<div style="position: absolute; left: 104px; top: 150px; width: 700px; display: flex; flex-direction: column; gap: 22px">
<span style="align-self: flex-start; padding: 8px 14px; border-radius: 12px; background: #FFFFFF; font-size: 28px; font-weight: 900; color: #7A4B2A">TL</span>
<h1 style="margin: 0; font-size: 72px; font-weight: 900; letter-spacing: -2.5px; line-height: 1">Tele Liban</h1>
<div style="display: flex; align-items: center; gap: 14px; font-size: 21px; color: #C7C7CC; font-weight: 500">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; letter-spacing: 1px; color: #FFFFFF">
<span style="width: 9px; height: 9px; border-radius: 5px; background: {{accent}}; display: inline-block"></span>LIVE</span>
<span>Channel 1</span><span aria-hidden="true">·</span><span>Lebanon</span><span aria-hidden="true">·</span><span>General</span><span aria-hidden="true">·</span>
<span style="padding: 2px 8px; border: 1.5px solid #8E8E93; border-radius: 6px; font-size: 15px; font-weight: 700; color: #C7C7CC">HD</span>
</div>
<p style="margin: 0; font-size: 22px; line-height: 1.5; color: #AEAEB2; max-width: 560px">Lebanon's public broadcaster. News, talk shows, local series and national events.</p>
<div style="display: flex; gap: 14px; margin-top: 14px">
<a href="V5Player.dc.html" style="text-decoration: none; display: inline-flex; align-items: center; gap: 12px; padding: 16px 34px; border-radius: 14px; background: #FFFFFF; color: #15161B; font-size: 22px; font-weight: 700; box-shadow: 0 0 0 4px #15161B, 0 0 0 8px #FFFFFF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>Watch</a>
<button type="button" aria-pressed="true" style="all: unset; display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px; border-radius: 14px; background: #2A2B33; color: #F5F5F7; font-family: inherit; font-size: 22px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="{{accent}}" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.3 5.3 3.2 1.7-1.9 3.1-3.2 5.3-3.2 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"></path></svg>In Favourites</button>
</div>
</div>

<section style="position: absolute; left: 104px; right: 0; top: 730px">
<h2 style="margin: 0 0 18px 0; font-size: 24px; font-weight: 700">More from Lebanon</h2>
<div style="display: flex; gap: 28px">
<sc-for list="{{more}}" as="ch" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; overflow: hidden; width: 250px; height: 140px; border-radius: 18px; background: {{ch.bg}}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: {{ch.ground}}"></div>
<span style="position: absolute; left: 12px; top: 12px; padding: 4px 9px; border-radius: 8px; background: #FFFFFF; font-size: 16px; font-weight: 900; color: {{ch.ink}}">{{ch.mono}}</span>
</div>
<span style="font-size: 21px; font-weight: 500; color: #AEAEB2">{{ch.name}}</span>
</div>
</sc-for>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9F0A","options":["#FF9F0A","#0A84FF","#30D158","#FF375F"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var more = [
      { name: 'Al Jadeed', mono: 'AJ', ink: '#8C2F45', bg: '#5B3A44', ground: '#3B2530' },
      { name: 'LBCI', mono: 'LB', ink: '#3B3F8C', bg: '#46486E', ground: '#2E2F4A' },
      { name: 'MTV Lebanon', mono: 'MT', ink: '#1F5A96', bg: '#2F4E73', ground: '#1F3550' },
      { name: '[Channel]', mono: '··', ink: '#636366', bg: '#3A3B45', ground: '#2A2B33' },
      { name: '[Channel]', mono: '··', ink: '#636366', bg: '#3A3B45', ground: '#2A2B33' },
      { name: '[Channel]', mono: '··', ink: '#636366', bg: '#3A3B45', ground: '#2A2B33' }
    ];
    return { accent: this.props.accent ?? '#FF9F0A', more: more };
  }
}
</script>
</body>
</html>
